name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # The src/ directory contains two `package main` targets (wpr and
      # httparchive) whose files cannot be compiled together, so their tests
      # are run file-by-file, mirroring scripts/build.py.
      - name: Run library tests
        run: go test ./src/webpagereplay/

      - name: Run wpr tests
        run: go test -C src wpr.go wpr_test.go

      - name: Run httparchive tests
        run: go test -C src httparchive.go httparchive_test.go
